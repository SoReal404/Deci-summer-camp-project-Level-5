<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Nexus — Better work, together.</title><link rel="stylesheet" href="/style.css"></head><body><div id="auth" class="auth-shell"><section class="auth-copy"><p class="eyebrow">NEXUS / COLLABORATION OS</p><h1>Work moves<br><i>as one.</i></h1><p>One focused place for teams to talk, deliver, and see every decision taking shape.</p><div class="signal"><span></span> All systems connected</div></section><section class="auth-card"><div class="mark">N</div><h2 id="authTitle">Welcome back</h2><p id="authSub">Sign in to your workspace.</p><form id="authForm"><input id="name" placeholder="Your name" autocomplete="name" hidden><input id="email" type="email" placeholder="Work email" required autocomplete="email"><input id="password" type="password" placeholder="Password" required autocomplete="current-password"><select id="team" hidden><option value="product">Product Studio</option><option value="engineers">Platform Engineering</option><option value="design">Design Systems</option></select><button id="authBtn">Sign in <b>→</b></button></form><p class="switch" id="switchText">New to Nexus? <button onclick="toggleAuth()">Create an account</button></p><p class="error" id="authError"></p></section></div><main id="app" hidden><aside><div class="brand"><div class="mark">N</div>NEXUS</div><nav><button class="nav active" data-view="chat">◌ <span>Conversations</span></button><button class="nav" data-view="tasks">□ <span>All tasks</span></button><button class="nav" data-view="team">◈ <span>My team</span></button><button class="nav" data-view="changes">⌘ <span>Version control</span></button></nav><div class="profile"><div class="avatar" id="profileAvatar"></div><div><strong id="profileName"></strong><small id="profileTeam"></small></div><button onclick="signout()">↗</button></div></aside><section class="workspace"><header><div><p class="eyebrow" id="kicker">CONVERSATIONS</p><h2 id="pageTitle">Across the company</h2></div><div class="live"><span></span> Live workspace</div></header><div id="view"></div></section></main><template id="chatView"><div class="chat-layout"><div class="rooms"><p class="label">SPACES</p><button class="room selected"># &nbsp;Global updates <em>3</em></button><p class="label">YOUR TEAM</p><button class="room"># &nbsp;<span id="myRoom"></span></button><div class="team-stack" id="teams"></div></div><div class="conversation"><div class="conversation-head"><div><h3># Global updates</h3><p>Company-wide collaboration</p></div><button class="outline">Invite people +</button></div><div class="messages" id="messages"></div><form class="composer" id="messageForm"><input id="messageInput" placeholder="Share an update with the company…"><button>Send <b>↑</b></button></form></div></div></template><template id="tasksView"><div class="toolbar"><p>Every team’s priorities, in one clear picture.</p><button class="primary" onclick="openModal('task')">+ Create task</button></div><div class="task-grid" id="allTasks"></div></template><template id="teamView"><div class="team-hero"><p class="eyebrow">TEAM PULSE</p><h3 id="teamName"></h3><p>Your team's work, ownership, and commitments—without the status chase.</p></div><div class="team-summary" id="teamSummary"></div><div class="table-wrap"><table><thead><tr><th>WORK ITEM</th><th>OWNER</th><th>DEADLINE</th><th>STATUS</th></tr></thead><tbody id="teamTasks"></tbody></table></div></template><template id="changesView"><div class="toolbar"><p>A human-readable record of every repository update.</p><button class="primary" onclick="openModal('change')">+ Log a change</button></div><div class="repo"><div><span class="repo-dot"></span><strong>acme / nexus-platform</strong><small>main</small></div><button class="outline">Repository settings</button></div><div class="changes" id="changes"></div></template><div id="modal" class="modal" hidden><div class="modal-card"><button class="close" onclick="closeModal()">×</button><p class="eyebrow" id="modalKicker"></p><h3 id="modalTitle"></h3><form id="modalForm"></form></div></div><script src="/app.js"></script></body></html>
