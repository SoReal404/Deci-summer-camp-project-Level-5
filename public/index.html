<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Nexus — Workspace & Leaderboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="auth" class="auth-shell">
    <section class="auth-copy">
      <p class="eyebrow">NEXUS / COLLABORATION OS</p>
      <h1>Work moves<br><i>as one.</i></h1>
      <p>One focused place for teams to talk, deliver tasks, earn points, and monitor rankings.</p>
      <div class="signal"><span></span> All systems operational</div>
    </section>
    
    <section class="auth-card">
      <div class="mark">N</div>
      <h2 id="authTitle">Welcome back</h2>
      <p id="authSub">Sign in to your workspace.</p>
      
      <form id="authForm">
        <input id="name" placeholder="Your name" autocomplete="name" hidden>
        <input id="email" type="email" placeholder="Work email" required autocomplete="email">
        <input id="password" type="password" placeholder="Password" required autocomplete="current-password">
        
        <select id="team" hidden>
          <option value="product">Product Studio</option>
          <option value="engineers">Platform Engineering</option>
          <option value="design">Design Systems</option>
        </select>

        <select id="role" hidden>
          <option value="teammate">Teammate (Standard Access)</option>
          <option value="leader">Leader (Project Manager / Full Access)</option>
        </select>

        <select id="title" hidden>
          <option value="Project Manager">Project Manager</option>
          <option value="Software Engineer">Software Engineer</option>
          <option value="Product Designer">Product Designer</option>
          <option value="Operations">Operations Specialist</option>
        </select>

        <button id="authBtn">Sign in <b>→</b></button>
      </form>
      
      <p class="switch" id="switchText">New to Nexus? <button onclick="toggleAuth()">Create an account</button></p>
      <p class="error" id="authError"></p>
    </section>
  </div>

  <main id="app" hidden>
    <aside>
      <div class="brand"><div class="mark">N</div>NEXUS</div>
      <nav>
        <button class="nav active" data-view="chat">◌ <span>Spaces & Chat</span></button>
        <button class="nav" data-view="tasks">□ <span>Tasks & Submissions</span></button>
        <button class="nav" data-view="leaderboard">🏆 <span>Leaderboard</span></button>
        <button class="nav" data-view="team">◈ <span>My Team</span></button>
        <button class="nav" data-view="changes">⌘ <span>Version Control</span></button>
      </nav>
      <div class="profile">
        <div class="avatar" id="profileAvatar"></div>
        <div>
          <strong id="profileName"></strong>
          <small id="profileRoleBadge"></small>
        </div>
        <button onclick="signout()">↗</button>
      </div>
    </aside>

    <section class="workspace">
      <header>
        <div>
          <p class="eyebrow" id="kicker">CONVERSATIONS</p>
          <h2 id="pageTitle">Across the company</h2>
        </div>
        <div class="live"><span></span> Live workspace</div>
      </header>
      <div id="view"></div>
    </section>
  </main>

  <template id="chatView">
    <div class="chat-layout">
      <div class="rooms">
        <p class="label">SPACES</p>
        <button class="room selected" onclick="switchSpace('general', this)"># &nbsp;General Talk</button>
        <button class="room" onclick="switchSpace('task-1', this)"># &nbsp;Task 1 Space</button>
        <button class="room" onclick="switchSpace('task-2', this)"># &nbsp;Task 2 Space</button>
        <button class="room" onclick="switchSpace('fun', this)"># &nbsp;Fun & Resting Space</button>

        <div class="team-stack" id="teams"></div>
      </div>
      
      <div class="conversation">
        <div class="conversation-head">
          <div>
            <h3 id="currentSpaceTitle"># General Talk</h3>
            <p>Collaborate with your team in this channel</p>
          </div>
          <button class="outline" id="inviteBtn" onclick="handleInvite()" hidden>Invite people +</button>
        </div>
        <div class="messages" id="messages"></div>
        <form class="composer" id="messageForm">
          <input id="messageInput" placeholder="Share an update or chat in this space…">
          <button>Send <b>↑</b></button>
        </form>
      </div>
    </div>
  </template>

  <template id="tasksView">
    <div class="toolbar">
      <p>Submit completed tasks to earn points and climb the leaderboard.</p>
      <button class="primary" id="createTaskBtn" onclick="openModal('task')" hidden>+ Create task</button>
    </div>
    <div class="task-grid" id="allTasks"></div>
  </template>

  <template id="leaderboardView">
    <div class="team-hero">
      <p class="eyebrow">GAMIFICATION</p>
      <h3>Workspace Leaderboard</h3>
      <p>Submit tasks on time to earn points and top the ranks!</p>
    </div>
    <div class="table-wrap" style="margin-top: 20px;">
      <table>
        <thead>
          <tr>
            <th>RANK</th>
            <th>MEMBER</th>
            <th>ROLE / TITLE</th>
            <th>TEAM</th>
            <th>POINTS</th>
          </tr>
        </thead>
        <tbody id="leaderboardRows"></tbody>
      </table>
    </div>
  </template>

  <template id="teamView">
    <div class="team-hero">
      <p class="eyebrow">TEAM PULSE</p>
      <h3 id="teamName"></h3>
      <p>Your team's work, ownership, and commitments—without the status chase.</p>
    </div>
    <div class="team-summary" id="teamSummary"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>WORK ITEM</th><th>OWNER</th><th>DEADLINE</th><th>STATUS</th></tr>
        </thead>
        <tbody id="teamTasks"></tbody>
      </table>
    </div>
  </template>

  <template id="changesView">
    <div class="toolbar">
      <p>A human-readable record of every repository update.</p>
      <button class="primary" onclick="openModal('change')">+ Log a change</button>
    </div>
    <div class="repo">
      <div><span class="repo-dot"></span><strong>acme / nexus-platform</strong><small>main</small></div>
      <button class="outline">Repository settings</button>
    </div>
    <div class="changes" id="changes"></div>
  </template>

  <div id="modal" class="modal" hidden>
    <div class="modal-card">
      <button class="close" onclick="closeModal()">×</button>
      <p class="eyebrow" id="modalKicker"></p>
      <h3 id="modalTitle"></h3>
      <form id="modalForm"></form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
